name: Sync Salesforce Agent Skills

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Compile Skills Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: forcedotcom/sf-skills
        run: |
          echo "Polling ${TARGET_REPO} repository..."
          
          AUTH_HEADER=()
          if [ -n "$GITHUB_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          SKILLS_JSON=$(curl -s "${AUTH_HEADER[@]}" "https://api.github.com/repos/${TARGET_REPO}/contents/skills")
          FOLDERS=$(echo "$SKILLS_JSON" | jq -r 'if type=="array" then .[] | select(.type=="dir") | .name else empty end')
          
          echo "[]" > data.json
          
          for folder in $FOLDERS; do
            echo "Processing skill: $folder"
            
            # Fetch the SKILL.md file
            MD_URL="https://raw.githubusercontent.com/${TARGET_REPO}/main/skills/$folder/SKILL.md"
            MD_CONTENT=$(curl -s -f "${AUTH_HEADER[@]}" "$MD_URL" || echo "No documentation found.")
            CLEAN_CONTENT=$(echo "$MD_CONTENT" | jq -Rsa .)
            
            # Query the commit history for this folder to find its creation/last-update date
            COMMIT_DATA=$(curl -s "${AUTH_HEADER[@]}" "https://api.github.com/repos/${TARGET_REPO}/commits?path=skills/$folder&per_page=1")
            COMMIT_DATE=$(echo "$COMMIT_DATA" | jq -r 'if type=="array" and length>0 then .[0].commit.committer.date else empty end')
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            fi
            
            # Append compiled dataset with the live timestamp attribute
            jq --arg id "$folder" \
               --arg name "$(echo $folder | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')" \
               --arg content "$CLEAN_CONTENT" \
               --arg date "$COMMIT_DATE" \
               --arg repo "$TARGET_REPO" \
               '. += [{id: $id, name: $name, markdown: $content, timestamp: $date, url: "https://github.com/\($repo)/tree/main/skills/\($id)"}]' data.json > tmp.json && mv tmp.json data.json
          done

      - name: Commit and Push Updates
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Automated Sync: Polled forcedotcom/sf-skills updates with timestamps"
          git push origin ${GITHUB_REF_NAME:-main}
